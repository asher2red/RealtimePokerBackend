<!DOCTYPE html>
<html>
<body>

<input id="msg" />
<button onclick="send()">Send</button>

<ul id="messages"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

<script>

const connection =
new signalR.HubConnectionBuilder()
.withUrl("http://localhost:5114/hubs/poker")
.build();

connection.on(
"ReceiveMessage",
(message)=>
{
    const li =
        document.createElement("li");

    li.textContent = message;

    document
        .getElementById("messages")
        .appendChild(li);
});

connection.start()
.then(() =>
{
    connection.invoke(
        "JoinRoom",
        "table-1",
        "admin");
});

function send()
{
    const msg =
        document
        .getElementById("msg")
        .value;

    connection.invoke(
        "SendMessage",
        "table-1",
        "admin",
        msg);
}

</script>

</body>
</html>
